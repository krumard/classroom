<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b63f6">
  <title>ออฟไลน์ | SRNR Learning Library</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:radial-gradient(circle at 20% 10%,#dff5ff,transparent 35%),#f5f9ff;color:#15365f}
    .card{width:min(480px,100%);text-align:center;padding:34px 24px;border-radius:28px;
      background:rgba(255,255,255,.92);border:1px solid rgba(24,111,220,.12);
      box-shadow:0 24px 70px rgba(22,87,170,.14)}
    img{width:94px;height:94px;border-radius:24px;box-shadow:0 14px 35px rgba(36,111,205,.16)}
    h1{margin:18px 0 8px;font-size:25px} p{margin:0;color:#6d84a4;line-height:1.75}
    button{margin-top:22px;border:0;border-radius:14px;padding:12px 18px;background:#0b63f6;color:#fff;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <img src="./icons/icon-192.png" alt="">
    <h1>ตอนนี้ยังไม่มีอินเทอร์เน็ต</h1>
    <p>ตัวแอปเปิดได้ แต่เนื้อหาจาก Google Apps Script, Drive และ Classroom ยังต้องใช้อินเทอร์เน็ต</p>
    <button onclick="location.reload()">ลองอีกครั้ง</button>
  </main>
</body>
</html>
