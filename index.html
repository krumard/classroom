<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#061b46">

  <title>ห้องสมุดสื่อการเรียนรู้</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f5f9ff;
    }

    .app-frame {
      display: block;
      width: 100%;
      height: 100dvh;
      border: 0;
      background: #ffffff;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: -1;

      display: grid;
      place-items: center;

      font-family:
        "Noto Sans Thai",
        "Leelawadee UI",
        Tahoma,
        sans-serif;

      color: #0b63f6;
      background:
        radial-gradient(
          circle at center,
          #ffffff,
          #eef6ff
        );
    }

    .loading div {
      text-align: center;
    }

    .loading .icon {
      display: block;
      font-size: 44px;
      margin-bottom: 10px;
    }

    .loading strong {
      display: block;
      font-size: 18px;
    }

    .loading small {
      display: block;
      margin-top: 5px;
      color: #6780a4;
    }

  </style>

</head>


<body>

  <div class="loading">

    <div>

      <span class="icon">📚</span>

      <strong>
        ห้องสมุดสื่อการเรียนรู้
      </strong>

      <small>
        กำลังเปิดระบบ...
      </small>

    </div>

  </div>


  <iframe

    class="app-frame"

    src="https://script.google.com/macros/s/AKfycbw2tJstDvaL7m7cpILAPxM4ra7qCgTAtE5rsoHW9RPqezMzrAH8CdiECVj51cNiR8zV/exec"

    title="ห้องสมุดสื่อการเรียนรู้"

    allow="fullscreen"

  ></iframe>

</body>

</html>
